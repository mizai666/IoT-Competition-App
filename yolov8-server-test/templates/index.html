<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP视频处理应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">RTSP视频处理应用</h1>
            <p class="text-gray-600 text-lg">实时播放RTSP流和目标检测功能</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- 视频流播放功能卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 transform transition duration-300 hover:scale-105">
                <div class="text-center mb-4">
                    <i class="fa fa-play-circle text-5xl text-blue-500 mb-4"></i>
                    <h2 class="text-2xl font-semibold text-gray-800">RTSP视频流播放</h2>
                </div>
                <p class="text-gray-600 mb-6">输入RTSP URL，实时播放视频流</p>

                <form action="/stream" method="get" class="space-y-4">
                    <div>
                        <label for="rtsp_url_stream" class="block text-sm font-medium text-gray-700 mb-1">RTSP URL:</label>
                        <input type="text" id="rtsp_url_stream" name="url"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="rtsp://example.com/stream" required>
                    </div>
                    <button type="submit"
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
                        <i class="fa fa-play mr-2"></i>开始播放
                    </button>
                </form>
            </div>

            <!-- 目标检测功能卡片 -->
            <div class="bg-white rounded-xl shadow-lg p-6 transform transition duration-300 hover:scale-105">
                <div class="text-center mb-4">
                    <i class="fa fa-search text-5xl text-green-500 mb-4"></i>
                    <h2 class="text-2xl font-semibold text-gray-800">目标检测</h2>
                </div>
                <p class="text-gray-600 mb-6">输入RTSP URL，捕获当前帧并进行目标检测</p>

                <form action="/detect" method="get" class="space-y-4">
                    <div>
                        <label for="rtsp_url_detect" class="block text-sm font-medium text-gray-700 mb-1">RTSP URL:</label>
                        <input type="text" id="rtsp_url_detect" name="url"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                               placeholder="rtsp://example.com/stream" required>
                    </div>
                    <button type="submit"
                            class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
                        <i class="fa fa-search-plus mr-2"></i>开始检测
                    </button>
                </form>
            </div>
        </div>

        <footer class="mt-16 text-center text-gray-500">
            <p>© 2023 RTSP视频处理应用 | 使用Flask和YOLOv8构建</p>
        </footer>
    </div>
</body>
</html>
