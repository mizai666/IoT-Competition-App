<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP视频流播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-gray-800">
                    <i class="fa fa-play-circle text-blue-500 mr-2"></i>RTSP视频流播放
                </h1>
                <a href="/" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
                    <i class="fa fa-home mr-1"></i>返回主页
                </a>
            </div>
            <p class="text-gray-600 mt-2">当前播放: <span class="font-medium break-all">{{ rtsp_url }}</span></p>
        </header>

        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex justify-center">
                {% if rtsp_url.startswith('rtsp://') %}
                    <div class="relative w-full max-w-4xl">
                        <img id="video_feed" src="{{ url_for('video_feed', url=rtsp_url) }}"
                             class="w-full h-auto rounded-lg border-4 border-gray-200"
                             alt="RTSP视频流">
                        <div class="absolute top-4 right-4 bg-red-500 text-white text-sm font-bold px-3 py-1 rounded-full flex items-center">
                            <span class="inline-block w-2 h-2 bg-white rounded-full mr-2 animate-pulse"></span>
                            直播中
                        </div>
                    </div>
                {% else %}
                    <div class="text-center py-12 px-4">
                        <i class="fa fa-exclamation-triangle text-yellow-500 text-5xl mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-800 mb-2">无效的RTSP URL</h3>
                        <p class="text-gray-600">请提供以rtsp://开头的有效URL</p>
                        <a href="/" class="mt-4 inline-block bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
                            返回主页
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>

        {% if rtsp_url.startswith('rtsp://') %}
        <div class="flex justify-center">
            <a href="{{ url_for('stream_page', url=rtsp_url) }}" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-6 rounded-lg transition duration-300">
                <i class="fa fa-refresh mr-2"></i>重新加载
            </a>
        </div>
        {% endif %}

        <footer class="mt-16 text-center text-gray-500">
            <p>© 2023 RTSP视频处理应用 | 使用Flask构建</p>
        </footer>
    </div>

    <script>
        // 检测视频流错误
        document.getElementById('video_feed')?.addEventListener('error', function() {
            alert('视频流加载失败，请检查RTSP URL是否有效或尝试重新加载');
        });
    </script>
</body>
</html>
