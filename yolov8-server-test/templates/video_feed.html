<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP视频流播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 视频容器自适应样式 */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            overflow: hidden;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持视频比例，不拉伸 */
            background-color: #000;
        }

        /* 加载动画 */
        .loader {
            border-top-color: #3498db;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">
                    <i class="fa fa-video-camera text-blue-500 mr-2"></i>RTSP视频流播放
                </h1>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button id="refresh_stream" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300 flex-1 sm:flex-none">
                        <i class="fa fa-refresh mr-1"></i>刷新流
                    </button>
                    <a href="/" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300 flex-1 sm:flex-none">
                        <i class="fa fa-home mr-1"></i>返回主页
                    </a>
                </div>
            </div>
            <p class="text-gray-600 mt-2 break-all">
                播放的流: <span class="font-medium">{{ rtsp_url }}</span>
            </p>
        </header>

        <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">视频流</h2>

            <div id="loading" class="video-container flex items-center justify-center">
                <div class="loader inline-block w-12 h-12 rounded-full border-4 border-gray-200"></div>
            </div>

            <div id="video_container" class="hidden">
                <div class="video-container rounded-lg overflow-hidden border-2 border-gray-200">
                    <video id="video_feed" autoplay playsinline class="w-full"></video>
                </div>

                <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <h3 class="font-medium text-gray-700 mb-1"><i class="fa fa-signal text-green-500 mr-1"></i>流状态</h3>
                        <p id="stream_status" class="text-sm text-gray-600">连接中...</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <h3 class="font-medium text-gray-700 mb-1"><i class="fa fa-clock-o text-blue-500 mr-1"></i>播放时长</h3>
                        <p id="stream_duration" class="text-sm text-gray-600">00:00:00</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <h3 class="font-medium text-gray-700 mb-1"><i class="fa fa-info-circle text-purple-500 mr-1"></i>分辨率</h3>
                        <p id="stream_resolution" class="text-sm text-gray-600">未知</p>
                    </div>
                </div>
            </div>

            <div id="error_container" class="hidden video-container flex flex-col items-center justify-center p-6 text-center">
                <i class="fa fa-exclamation-triangle text-yellow-500 text-5xl mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-800 mb-2" id="error_message">无法连接到视频流</h3>
                <button id="retry_stream" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-6 rounded-lg transition duration-300">
                    <i class="fa fa-refresh mr-1"></i>重试连接
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">操作选项</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <a href="{{ url_for('detect', url=rtsp_url) }}" class="block bg-purple-500 hover:bg-purple-600 text-white font-medium py-3 px-4 rounded-lg transition duration-300 text-center">
                    <i class="fa fa-search mr-2"></i>对当前帧进行目标检测
                </a>
                <button id="fullscreen_toggle" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-lg transition duration-300">
                    <i class="fa fa-expand mr-2"></i>全屏观看
                </button>
            </div>
        </div>

        <footer class="mt-16 text-center text-gray-500">
            <p>© 2023 RTSP视频处理应用 | 使用Flask和OpenCV构建</p>
        </footer>
    </div>

    <script>
        // 页面加载完成后初始化视频流
        document.addEventListener('DOMContentLoaded', function() {
            const rtspUrl = "{{ rtsp_url }}";
            const videoElement = document.getElementById('video_feed');
            let durationTimer = null;
            let seconds = 0;

            // 检查RTSP URL是否有效
            if (!rtspUrl.startsWith('rtsp://')) {
                showError('无效的RTSP URL，请提供以rtsp://开头的有效URL');
                return;
            }

            // 初始化视频流
            initVideoStream();

            // 刷新流按钮事件
            document.getElementById('refresh_stream').addEventListener('click', function() {
                resetStream();
                initVideoStream();
            });

            // 重试连接按钮事件
            document.getElementById('retry_stream').addEventListener('click', function() {
                resetStream();
                initVideoStream();
            });

            // 全屏切换按钮事件
            document.getElementById('fullscreen_toggle').addEventListener('click', function() {
                toggleFullscreen();
            });

            // 初始化视频流
            function initVideoStream() {
                // 设置视频源
                const streamUrl = "{{ url_for('video_feed') }}?url=" + encodeURIComponent(rtspUrl);

                // 对于不同浏览器的兼容性处理
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(videoElement);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        videoElement.play().catch(error => {
                            console.error('播放失败:', error);
                            showError('视频播放失败，请重试');
                        });
                        showVideo();
                        startDurationTimer();
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.error('HLS错误:', data);
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    showError('视频流加载失败，请重试');
                                    break;
                            }
                        }
                    });
                }
                // 原生支持HLS的浏览器 (Safari)
                else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = streamUrl;
                    videoElement.addEventListener('loadedmetadata', function() {
                        videoElement.play().catch(error => {
                            console.error('播放失败:', error);
                            showError('视频播放失败，请重试');
                        });
                        showVideo();
                        startDurationTimer();
                    });

                    videoElement.addEventListener('error', function() {
                        console.error('视频错误:', videoElement.error);
                        showError('视频流加载失败，请重试');
                    });
                }
                // 不支持HLS的情况
                else {
                    showError('您的浏览器不支持视频流播放，请使用现代浏览器');
                }

                // 监听视频尺寸变化，更新分辨率显示
                videoElement.addEventListener('loadedmetadata', updateResolution);
                videoElement.addEventListener('resize', updateResolution);
            }

            // 显示视频容器，隐藏加载和错误容器
            function showVideo() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error_container').classList.add('hidden');
                document.getElementById('video_container').classList.remove('hidden');
                document.getElementById('stream_status').textContent = '播放中';
                document.getElementById('stream_status').className = 'text-sm text-green-600 font-medium';
            }

            // 显示错误信息
            function showError(message) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('video_container').classList.add('hidden');
                document.getElementById('error_container').classList.remove('hidden');
                document.getElementById('error_message').textContent = message;

                // 停止计时器
                stopDurationTimer();
            }

            // 重置视频流状态
            function resetStream() {
                document.getElementById('video_feed').src = '';
                document.getElementById('loading').classList.remove('hidden');
                document.getElementById('video_container').classList.add('hidden');
                document.getElementById('error_container').classList.add('hidden');

                // 重置计时器和状态
                stopDurationTimer();
                seconds = 0;
                document.getElementById('stream_duration').textContent = '00:00:00';
                document.getElementById('stream_resolution').textContent = '未知';
            }

            // 启动播放时长计时器
            function startDurationTimer() {
                stopDurationTimer(); // 先停止可能存在的计时器
                durationTimer = setInterval(function() {
                    seconds++;
                    // 格式化时间为 HH:MM:SS
                    const hours = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const secs = (seconds % 60).toString().padStart(2, '0');
                    document.getElementById('stream_duration').textContent = `${hours}:${minutes}:${secs}`;
                }, 1000);
            }

            // 停止播放时长计时器
            function stopDurationTimer() {
                if (durationTimer) {
                    clearInterval(durationTimer);
                    durationTimer = null;
                }
            }

            // 更新分辨率显示
            function updateResolution() {
                if (videoElement.videoWidth && videoElement.videoHeight) {
                    document.getElementById('stream_resolution').textContent =
                        `${videoElement.videoWidth} × ${videoElement.videoHeight}`;
                }
            }

            // 切换全屏模式
            function toggleFullscreen() {
                const videoContainer = document.querySelector('.video-container');

                if (!document.fullscreenElement) {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.webkitRequestFullscreen) { // Safari
                        videoContainer.webkitRequestFullscreen();
                    } else if (videoContainer.msRequestFullscreen) { // IE/Edge
                        videoContainer.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) { // Safari
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) { // IE/Edge
                        document.msExitFullscreen();
                    }
                }
            }

            // 监听全屏状态变化，更新按钮文本
            document.addEventListener('fullscreenchange', updateFullscreenButton);
            document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
            document.addEventListener('msfullscreenchange', updateFullscreenButton);

            function updateFullscreenButton() {
                const fullscreenButton = document.getElementById('fullscreen_toggle');
                if (document.fullscreenElement) {
                    fullscreenButton.innerHTML = '<i class="fa fa-compress mr-2"></i>退出全屏';
                } else {
                    fullscreenButton.innerHTML = '<i class="fa fa-expand mr-2"></i>全屏观看';
                }
            }
        });
    </script>
    <!-- 引入HLS.js用于处理视频流 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
</body>
</html>
